apiVersion: v1
kind: Secret
metadata:
  name: autogarage-api-secrets
  labels:
    app: autogarage-api
type: Opaque
# TODO: Replace when REST API use a DB connection
stringData:
  DB_PASSWORD: "YourSecurePasswordHere"
  ConnectionStrings__DefaultConnection: "Host=autogarage-db-instance;Database=autogarage_db;Username=autogarage_admin;Password=YourSecurePasswordHere"