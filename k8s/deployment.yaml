apiVersion: apps/v1
kind: Deployment
metadata:
  name: autogarage-api-deployment
  labels:
    app: autogarage-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autogarage-api
  template:
    metadata:
      labels:
        app: autogarage-api
    spec:
      containers:
      - name: autogarage-api
        # Replace <REGION> and <PROJECT_ID> with your GCP details
        # image: us-central1-docker.pkg.dev/<PROJECT_ID>/autogarage-api-repo/autogarage-api:latest
        image: autogarage-local-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        # envFrom:
        # - configMapRef:
        #     name: autogarage-api-config
        # - secretRef:
        #     name: autogarage-api-secrets
        resources:
          requests:
            cpu: "30m"
            memory: "128Mi"
          limits:
            cpu: "50m"
            memory: "512Mi"