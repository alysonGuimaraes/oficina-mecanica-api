apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - service-account.yaml
  - secret-store.yaml
  - external-secret.yaml

configMapGenerator:
  - name: autogarage-api-config
    literals:
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_ENVIRONMENT=Production
    envs:
      - runtime-config.env