apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

configMapGenerator:
  - name: autogarage-api-config
    literals:
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_ENVIRONMENT=Production
    envs:
      - runtime-config.env

# Sensitive values only (database connection, JWT key, password pepper, bootstrap admin).
# secret.env is generated by the release pipeline and must never be committed.
secretGenerator:
  - name: autogarage-api-secrets
    envs:
      - secret.env