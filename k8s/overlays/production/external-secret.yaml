apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: autogarage-api-secrets
  labels:
    app: autogarage-api
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: autogarage-secret-store
    kind: SecretStore

  target:
    name: autogarage-api-secrets
    creationPolicy: Owner

  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: autogarage-db-password
