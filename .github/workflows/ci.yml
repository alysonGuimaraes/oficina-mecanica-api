name: CI

# Runs on every push and pull request: static analysis, build and tests.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  SOLUTION: src/AutoGarage.slnx

jobs:
  analyze-build-test:
    name: Analyze, build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore "$SOLUTION"

      - name: Format check
        run: dotnet format "$SOLUTION" --verify-no-changes --severity warn

      - name: Build
        run: dotnet build "$SOLUTION" --no-restore -c Release

      - name: Test
        run: dotnet test "$SOLUTION" --no-build -c Release --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test-results
          path: "**/*.trx"
          if-no-files-found: ignore
