name: Release

# Triggered by a version tag (e.g. v0.1.0) or manually for a specific tag
# (useful to roll back / redeploy a previous version). Validates the build,
# publishes the image to Artifact Registry and deploys it to GKE. The deploy
# job runs under the "production" environment, so it waits for manual approval.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and deploy (e.g. v0.1.0)"
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGION: ${{ vars.GCP_REGION }}
  CLUSTER: autogarage-k8s-cluster
  DB_INSTANCE: autogarage-db-instance
  REPO: autogarage-api-repo
  IMAGE_NAME: autogarage-api
  OVERLAY: k8s/overlays/production
  SOLUTION: src/AutoGarage.slnx
  # Tag being released and the git ref to check out (tag push uses ref_name/ref).
  IMAGE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  REF: ${{ github.event.inputs.tag || github.ref }}

jobs:
  # Resolve the target image and decide whether it still needs to be built.
  # Tags are treated as immutable history: if the image already exists in
  # Artifact Registry, build and push are skipped to avoid rewriting it.
  check:
    name: Check image
    runs-on: ubuntu-latest
    outputs:
      image_exists: ${{ steps.image_exists.outputs.image_exists }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db

      - name: Resolve image URI
        id: meta
        run: |
          echo "image_uri=$REGION-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/$REPO/$IMAGE_NAME:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Check if the image already exists
        id: image_exists
        run: |
          if gcloud artifacts docker images describe "${{ steps.meta.outputs.image_uri }}" >/dev/null 2>&1; then
            echo "image_exists=true" >> "$GITHUB_OUTPUT"
            echo "Image already exists; build and push will be skipped."
          else
            echo "image_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        run: |
          {
            echo "## Release $IMAGE_TAG"
            echo "- Image: \`${{ steps.meta.outputs.image_uri }}\`"
            echo "- Already in Artifact Registry: ${{ steps.image_exists.outputs.image_exists }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Validate compilation and produce the container image as an artifact.
  build:
    name: Validate and build image
    needs: check
    if: needs.check.outputs.image_exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.REF }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore "$SOLUTION"

      - name: Format check
        run: dotnet format "$SOLUTION" --verify-no-changes --severity warn

      - name: Build
        run: dotnet build "$SOLUTION" --no-restore -c Release

      - name: Test
        run: dotnet test "$SOLUTION" --no-build -c Release

      - name: Build container image
        env:
          IMAGE_URI: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        run: docker build -t "$IMAGE_URI" .

      - name: Save image
        env:
          IMAGE_URI: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        run: docker save "$IMAGE_URI" -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ env.IMAGE_NAME }}
          path: image.tar
          retention-days: 1

  # Publish the built image to Artifact Registry.
  push:
    name: Push image
    needs: [check, build]
    if: needs.check.outputs.image_exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.IMAGE_NAME }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Load and push image
        env:
          IMAGE_URI: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        run: |
          docker load -i image.tar
          docker push "$IMAGE_URI"

  # Update the deployment in the GKE cluster. Runs whether the image was just
  # published or reused. Gated by the "production" environment (configure
  # required reviewers to force a manual approval).
  deploy:
    name: Deploy to GKE
    needs: [check, build, push]
    if: always() && (needs.check.outputs.image_exists == 'true' || needs.push.result == 'success')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.REF }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.REGION }}

      # Builds the ConfigMap env file: the non-secret runtime config plus the database
      # connection string, assembled here from the Cloud SQL private IP and the DB_PASSWORD
      # GitHub secret. The ConnectionStrings__ key must not come from RUNTIME_CONFIG.
      - name: Write runtime config
        env:
          RUNTIME_CONFIG: ${{ secrets.RUNTIME_CONFIG }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          PASSWORD_ADDITIONAL_KEY: ${{ secrets.PASSWORD_ADDITIONAL_KEY }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
          JWT_EXPIRES_IN_MINUTES: ${{ vars.JWT_EXPIRES_IN_MINUTES }}
          GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          EMAIL_SENDER_API_KEY: ${{ secrets.EMAIL_SENDER_API_KEY }}
          EMAIL_SENDER_FROM_EMAIL: ${{ vars.EMAIL_SENDER_FROM_EMAIL }}
        run: |
          # Only the keys this step writes are reserved here; the others may come from RUNTIME_CONFIG.
          if printf '%s\n' "$RUNTIME_CONFIG" | grep -q '^ConnectionStrings__\|^Settings__Jwt__Key=\|^Settings__Jwt__ExpiresInMinutes=\|^Settings__Password__\|^Settings__BootstrapAdmin__\|^Settings__TestData__\|^Settings__Brevo__'; then
            echo "::error::Remove ConnectionStrings__*, Settings__Jwt__Key, Settings__Jwt__ExpiresInMinutes, Settings__Password__*, Settings__BootstrapAdmin__*, Settings__TestData__* and Settings__Brevo__* from RUNTIME_CONFIG; the pipeline builds them and test data must never run in production."
            exit 1
          fi
          if ! [[ "$JWT_EXPIRES_IN_MINUTES" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::The JWT_EXPIRES_IN_MINUTES variable must be a positive integer (token lifetime in minutes)."
            exit 1
          fi
          if [ -z "$BOOTSTRAP_ADMIN_EMAIL" ] || [ -z "$BOOTSTRAP_ADMIN_PASSWORD" ]; then
            echo "::error::The BOOTSTRAP_ADMIN_EMAIL and BOOTSTRAP_ADMIN_PASSWORD secrets must be set (first employee, admin)."
            exit 1
          fi
          if [ -z "$EMAIL_SENDER_API_KEY" ] || [ -z "$EMAIL_SENDER_FROM_EMAIL" ]; then
            echo "::error::The EMAIL_SENDER_API_KEY secret and the EMAIL_SENDER_FROM_EMAIL variable must be set (Brevo sender)."
            exit 1
          fi
          if [ -z "$JWT_KEY" ]; then
            echo "::error::The JWT_KEY secret is empty or missing."
            exit 1
          fi
          # Without this key the password hash silently loses its pepper (the app does not fail), so it is mandatory.
          if [ -z "$PASSWORD_ADDITIONAL_KEY" ]; then
            echo "::error::The PASSWORD_ADDITIONAL_KEY secret is empty or missing."
            exit 1
          fi
          # --project is explicit: the auth action does not set the gcloud default project.
          DB_HOST=$(gcloud sql instances describe "$DB_INSTANCE" --project "$GCP_PROJECT" --format='value(ipAddresses[0].ipAddress)')
          # Non-sensitive values go to the ConfigMap (runtime-config.env).
          {
            printf '%s\n' "$RUNTIME_CONFIG"
            echo "Settings__Jwt__ExpiresInMinutes=$JWT_EXPIRES_IN_MINUTES"
            echo "Settings__Brevo__Enabled=true"
            echo "Settings__Brevo__FromEmail=$EMAIL_SENDER_FROM_EMAIL"
            echo "Settings__Brevo__FromName=AutoGarage"
          } > "$OVERLAY/runtime-config.env"

          # Sensitive values go to the Secret (secret.env): connection string with the password,
          # JWT signing key, password pepper, bootstrap admin credentials and the Brevo API key.
          {
            echo "ConnectionStrings__DefaultConnection=Host=$DB_HOST;Port=5432;Database=autogarage;Username=autogarage_admin;Password=$DB_PASSWORD"
            echo "Settings__Jwt__Key=$JWT_KEY"
            echo "Settings__Password__AdditionalKey=$PASSWORD_ADDITIONAL_KEY"
            echo "Settings__BootstrapAdmin__Email=$BOOTSTRAP_ADMIN_EMAIL"
            echo "Settings__BootstrapAdmin__Password=$BOOTSTRAP_ADMIN_PASSWORD"
            echo "Settings__Brevo__ApiKey=$EMAIL_SENDER_API_KEY"
          } > "$OVERLAY/secret.env"

      # Pins the image with an "images" entry appended to the overlay kustomization.
      # kubectl ships a built-in kustomize, so no kustomize binary is downloaded.
      - name: Pin image in the overlay
        env:
          IMAGE_URI: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        run: |
          cat >> "$OVERLAY/kustomization.yaml" <<EOF

          images:
            - name: autogarage-api-image
              newName: ${IMAGE_URI%:*}
              newTag: ${IMAGE_TAG}
          EOF

      - name: Deploy
        run: |
          kubectl apply -k "$OVERLAY"
          kubectl rollout status deployment/autogarage-api-deployment --timeout=180s

      - name: Debug rollout failure
        if: failure()
        run: |
          set +e
          echo "=== pods ==="
          kubectl get pods -n default -o wide
          echo "=== deployment ==="
          kubectl describe deployment/autogarage-api-deployment -n default
          echo "=== events ==="
          kubectl get events -n default --sort-by=.lastTimestamp | tail -n 40
          echo "=== pod describe ==="
          kubectl describe pods -n default -l app=autogarage-api
          echo "=== pod logs ==="
          kubectl logs -n default -l app=autogarage-api --all-containers --tail=200
