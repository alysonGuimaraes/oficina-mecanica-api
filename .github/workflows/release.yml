name: Release

# Triggered by a version tag (e.g. v0.1.0). Builds and pushes the image with the
# exact tag, then updates the deployment in the GKE cluster.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGION: southamerica-east1
  CLUSTER: autogarage-k8s-cluster
  REPO: autogarage-api-repo
  IMAGE_NAME: autogarage-api
  OVERLAY: k8s/overlays/production

jobs:
  release:
    name: Build, push and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          IMAGE_URI="$REGION-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/$REPO/$IMAGE_NAME:${GITHUB_REF_NAME}"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.REGION }}

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/kustomize

      - name: Write runtime config
        env:
          RUNTIME_CONFIG: ${{ secrets.RUNTIME_CONFIG }}
        run: printf '%s\n' "$RUNTIME_CONFIG" > "$OVERLAY/runtime-config.env"

      - name: Pin image in the overlay
        run: kustomize edit set image autogarage-api-image="$IMAGE_URI" --kustomize-dir "$OVERLAY"

      - name: Deploy
        run: |
          kubectl apply -k "$OVERLAY"
          kubectl rollout status deployment/autogarage-api-deployment --timeout=180s
